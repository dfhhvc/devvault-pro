<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; }
      .card { fill: #1e293b; }
      .border { stroke: #334155; stroke-width: 1; fill: none; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .accent { fill: #3b82f6; }
      .accent-bg { fill: #1e3a5f; }
      .green { fill: #22c55e; }
      .green-bg { fill: #14532d; }
      .red { fill: #ef4444; }
      .red-bg { fill: #450a0a; }
      .yellow-bg { fill: #422006; }
      .yellow { fill: #eab308; }
      .mono { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>
  <rect class="bg" width="1280" height="720"/>

  <!-- Sidebar -->
  <rect class="sidebar" x="0" y="0" width="240" height="720"/>
  <line x1="240" y1="0" x2="240" y2="720" stroke="#334155" stroke-width="1"/>

  <!-- Logo area -->
  <g transform="translate(20,24)">
    <path d="M10,4 L30,12 L30,28 Q30,40 10,46 Q-10,40 -10,28 L-10,12 Z" transform="translate(20,20)" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <text x="52" y="30" class="text" font-size="15" font-weight="600">DevVault Pro</text>
  </g>
  <line x1="0" y1="60" x2="240" y2="60" stroke="#334155" stroke-width="1"/>

  <!-- Sidebar categories -->
  <text x="20" y="88" class="muted" font-size="10" font-weight="600" letter-spacing="1">JSON 工具</text>
  <rect x="8" y="98" width="224" height="32" rx="6" class="accent-bg"/>
  <text x="20" y="118" class="text" font-size="13" fill="#60a5fa">JSON → TypeScript</text>
  <text x="20" y="150" class="muted" font-size="13">JSON 格式化</text>
  <text x="20" y="174" class="muted" font-size="13">JSON 验证</text>
  <text x="20" y="198" class="muted" font-size="13">JSON ↔ YAML</text>

  <text x="20" y="234" class="muted" font-size="10" font-weight="600" letter-spacing="1">转换工具</text>
  <text x="20" y="258" class="muted" font-size="13">颜色转换器</text>
  <text x="20" y="282" class="muted" font-size="13">文本 Diff 对比</text>

  <text x="20" y="318" class="muted" font-size="10" font-weight="600" letter-spacing="1">编码解码</text>
  <text x="20" y="342" class="muted" font-size="13">Base64</text>
  <text x="20" y="366" class="muted" font-size="13">URL 编码</text>
  <text x="20" y="390" class="muted" font-size="13">HTML 实体</text>

  <text x="20" y="426" class="muted" font-size="10" font-weight="600" letter-spacing="1">哈希与生成</text>
  <text x="20" y="450" class="muted" font-size="13">哈希计算</text>
  <text x="20" y="474" class="muted" font-size="13">UUID / NanoID</text>
  <text x="20" y="498" class="muted" font-size="13">密码生成器</text>

  <text x="20" y="534" class="muted" font-size="10" font-weight="600" letter-spacing="1">时间工具</text>
  <text x="20" y="558" class="muted" font-size="13">时间戳转换</text>
  <text x="20" y="582" class="muted" font-size="13">时区转换</text>

  <!-- Header -->
  <rect x="240" y="0" width="1040" height="56" fill="#1e293b" opacity="0.5"/>
  <line x1="240" y1="56" x2="1280" y2="56" stroke="#334155" stroke-width="1"/>
  <text x="264" y="34" class="text" font-size="14" font-weight="600">JSON → TypeScript</text>
  <text x="430" y="34" class="muted" font-size="13">/ 从 JSON 生成 TypeScript 接口定义</text>

  <!-- Privacy badge -->
  <rect x="1100" y="16" width="150" height="24" rx="12" class="green-bg"/>
  <circle cx="1116" cy="28" r="4" class="green"/>
  <text x="1126" y="32" class="text" font-size="11" fill="#4ade80" font-weight="500">100% 本地运行</text>

  <!-- Main content area -->
  <g transform="translate(264, 80)">
    <!-- Input panel -->
    <text x="0" y="16" class="text" font-size="13" font-weight="500">JSON 输入</text>
    <rect x="0" y="28" width="470" height="380" rx="8" class="card" stroke="#334155" stroke-width="1"/>
    <text x="16" y="52" class="mono muted" font-size="12">{</text>
    <text x="32" y="72" class="mono" font-size="12" fill="#93c5fd">"name"</text>
    <text x="90" y="72" class="mono" font-size="12">: </text>
    <text x="110" y="72" class="mono" font-size="12" fill="#86efac">"Alice"</text>
    <text x="160" y="72" class="mono" font-size="12">,</text>
    <text x="32" y="92" class="mono" font-size="12" fill="#93c5fd">"age"</text>
    <text x="78" y="92" class="mono" font-size="12">: </text>
    <text x="98" y="92" class="mono" font-size="12" fill="#fbbf24">30</text>
    <text x="112" y="92" class="mono" font-size="12">,</text>
    <text x="32" y="112" class="mono" font-size="12" fill="#93c5fd">"isActive"</text>
    <text x="120" y="112" class="mono" font-size="12">: </text>
    <text x="140" y="112" class="mono" font-size="12" fill="#c4b5fd">true</text>
    <text x="170" y="112" class="mono" font-size="12">,</text>
    <text x="32" y="132" class="mono" font-size="12" fill="#93c5fd">"tags"</text>
    <text x="84" y="132" class="mono" font-size="12">: [</text>
    <text x="104" y="152" class="mono" font-size="12" fill="#86efac">"dev"</text>
    <text x="140" y="152" class="mono" font-size="12">,</text>
    <text x="160" y="152" class="mono" font-size="12" fill="#86efac">"typescript"</text>
    <text x="32" y="172" class="mono" font-size="12">],</text>
    <text x="32" y="192" class="mono" font-size="12" fill="#93c5fd">"address"</text>
    <text x="120" y="192" class="mono" font-size="12">: {</text>
    <text x="48" y="212" class="mono" font-size="12" fill="#93c5fd">"city"</text>
    <text x="106" y="212" class="mono" font-size="12">: </text>
    <text x="126" y="212" class="mono" font-size="12" fill="#86efac">"Beijing"</text>
    <text x="190" y="212" class="mono" font-size="12">,</text>
    <text x="48" y="232" class="mono" font-size="12" fill="#93c5fd">"zip"</text>
    <text x="94" y="232" class="mono" font-size="12">: </text>
    <text x="114" y="232" class="mono" font-size="12" fill="#86efac">"100000"</text>
    <text x="32" y="252" class="mono" font-size="12">}</text>
    <text x="16" y="272" class="mono" font-size="12">}</text>

    <!-- Arrow -->
    <text x="500" y="210" class="accent" font-size="24">→</text>

    <!-- Output panel -->
    <text x="540" y="16" class="text" font-size="13" font-weight="500">TypeScript 输出</text>
    <rect x="540" y="28" width="470" height="380" rx="8" class="card" stroke="#334155" stroke-width="1"/>
    <text x="556" y="52" class="mono muted" font-size="11">/** Generated by DevVault Pro */</text>
    <text x="556" y="76" class="mono" font-size="12" fill="#c4b5fd">export interface</text>
    <text x="672" y="76" class="mono" font-size="12" fill="#93c5fd">Address</text>
    <text x="728" y="76" class="mono" font-size="12"> {</text>
    <text x="572" y="96" class="mono" font-size="12" fill="#93c5fd">city</text>
    <text x="612" y="96" class="mono" font-size="12">: </text>
    <text x="632" y="96" class="mono" font-size="12" fill="#86efac">string</text>
    <text x="672" y="96" class="mono" font-size="12">;</text>
    <text x="572" y="116" class="mono" font-size="12" fill="#93c5fd">zip</text>
    <text x="608" y="116" class="mono" font-size="12">: </text>
    <text x="628" y="116" class="mono" font-size="12" fill="#86efac">string</text>
    <text x="668" y="116" class="mono" font-size="12">;</text>
    <text x="556" y="136" class="mono" font-size="12">}</text>
    <text x="556" y="164" class="mono" font-size="12"></text>
    <text x="556" y="168" class="mono" font-size="12" fill="#c4b5fd">export interface</text>
    <text x="672" y="168" class="mono" font-size="12" fill="#93c5fd">Root</text>
    <text x="716" y="168" class="mono" font-size="12"> {</text>
    <text x="572" y="188" class="mono" font-size="12" fill="#93c5fd">name</text>
    <text x="620" y="188" class="mono" font-size="12">: </text>
    <text x="640" y="188" class="mono" font-size="12" fill="#86efac">string</text>
    <text x="680" y="188" class="mono" font-size="12">;</text>
    <text x="572" y="208" class="mono" font-size="12" fill="#93c5fd">age</text>
    <text x="610" y="208" class="mono" font-size="12">: </text>
    <text x="630" y="208" class="mono" font-size="12" fill="#fbbf24">number</text>
    <text x="680" y="208" class="mono" font-size="12">;</text>
    <text x="572" y="228" class="mono" font-size="12" fill="#93c5fd">isActive</text>
    <text x="640" y="228" class="mono" font-size="12">: </text>
    <text x="660" y="228" class="mono" font-size="12" fill="#c4b5fd">boolean</text>
    <text x="712" y="228" class="mono" font-size="12">;</text>
    <text x="572" y="248" class="mono" font-size="12" fill="#93c5fd">tags</text>
    <text x="612" y="248" class="mono" font-size="12">: </text>
    <text x="632" y="248" class="mono" font-size="12" fill="#86efac">string</text>
    <text x="672" y="248" class="mono" font-size="12">[];</text>
    <text x="572" y="268" class="mono" font-size="12" fill="#93c5fd">address</text>
    <text x="636" y="268" class="mono" font-size="12">: </text>
    <text x="656" y="268" class="mono" font-size="12" fill="#93c5fd">Address</text>
    <text x="712" y="268" class="mono" font-size="12">;</text>
    <text x="556" y="288" class="mono" font-size="12">}</text>

    <!-- Generate button -->
    <rect x="900" y="420" width="110" height="32" rx="6" class="accent"/>
    <text x="940" y="440" class="text" font-size="13" font-weight="500" text-anchor="middle" fill="#fff">生成</text>
  </g>

  <!-- Footer status bar -->
  <rect x="240" y="688" width="1040" height="32" fill="#1e293b" opacity="0.5"/>
  <text x="264" y="708" class="muted" font-size="11">18 tools · 100% offline · zero tracking</text>
  <text x="1100" y="708" class="muted" font-size="11">Ctrl+Enter to process</text>
</svg>
