<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 667" width="375" height="667">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .sidebar { fill: #1e293b; }
      .card { fill: #1e293b; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #e2e8f0; }
      .muted { fill: #94a3b8; }
      .accent { fill: #3b82f6; }
      .accent-bg { fill: #1e3a5f; }
      .green { fill: #22c55e; }
      .green-bg { fill: #14532d; }
      .mono { font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>
  <rect class="bg" width="375" height="667"/>

  <!-- Header -->
  <rect x="0" y="0" width="375" height="56" fill="#1e293b" opacity="0.8"/>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#334155" stroke-width="1"/>
  <rect x="16" y="18" width="20" height="20" rx="4" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="44" y="34" class="text" font-size="14" font-weight="600">DevVault Pro</text>
  <rect x="270" y="18" width="90" height="20" rx="10" class="green-bg"/>
  <circle cx="282" cy="28" r="3" class="green"/>
  <text x="290" y="32" class="text" font-size="9" fill="#4ade80" font-weight="500">100% 本地运行</text>

  <!-- Mobile menu icon -->
  <rect x="345" y="24" width="16" height="2" rx="1" fill="#94a3b8"/>
  <rect x="345" y="28" width="16" height="2" rx="1" fill="#94a3b8"/>
  <rect x="345" y="32" width="16" height="2" rx="1" fill="#94a3b8"/>

  <!-- Tool title -->
  <text x="16" y="84" class="text" font-size="16" font-weight="600">颜色转换器</text>
  <text x="16" y="102" class="muted" font-size="12">HEX / RGB / HSL / OKLCH 互转</text>

  <!-- Color input -->
  <text x="16" y="134" class="text" font-size="12" font-weight="500">输入颜色</text>
  <rect x="16" y="142" width="343" height="56" rx="8" class="card" stroke="#334155" stroke-width="1"/>
  <rect x="28" y="154" width="32" height="32" rx="6" fill="#3b82f6"/>
  <text x="72" y="176" class="mono" font-size="14" fill="#60a5fa">#3b82f6</text>
  <text x="180" y="176" class="muted" font-size="10">检测到: HEX</text>

  <!-- Results -->
  <rect x="16" y="214" width="343" height="44" rx="8" class="card" stroke="#334155" stroke-width="1"/>
  <text x="28" y="240" class="muted" font-size="10" font-weight="600">HEX</text>
  <text x="72" y="240" class="mono text" font-size="12">#3b82f6</text>

  <rect x="16" y="266" width="343" height="44" rx="8" class="card" stroke="#334155" stroke-width="1"/>
  <text x="28" y="292" class="muted" font-size="10" font-weight="600">RGB</text>
  <text x="72" y="292" class="mono text" font-size="12">rgb(59, 130, 246)</text>

  <rect x="16" y="318" width="343" height="44" rx="8" class="card" stroke="#334155" stroke-width="1"/>
  <text x="28" y="344" class="muted" font-size="10" font-weight="600">HSL</text>
  <text x="72" y="344" class="mono text" font-size="12">hsl(217, 91%, 60%)</text>

  <rect x="16" y="370" width="343" height="44" rx="8" class="card" stroke="#334155" stroke-width="1"/>
  <text x="28" y="396" class="muted" font-size="10" font-weight="600">OKLCH</text>
  <text x="72" y="396" class="mono text" font-size="12">oklch(62.3 0.19 259.5)</text>

  <!-- Quick tools list -->
  <text x="16" y="448" class="muted" font-size="10" font-weight="600" letter-spacing="1">快速工具</text>
  <rect x="16" y="458" width="343" height="36" rx="6" class="accent-bg"/>
  <text x="28" y="480" class="text" font-size="12" fill="#60a5fa">JSON → TypeScript</text>
  <text x="320" y="480" class="muted" font-size="14">›</text>

  <rect x="16" y="500" width="343" height="36" rx="6" class="card" stroke="#334155" stroke-width="1"/>
  <text x="28" y="522" class="muted" font-size="12">文本 Diff 对比</text>
  <text x="320" y="522" class="muted" font-size="14">›</text>

  <rect x="16" y="542" width="343" height="36" rx="6" class="card" stroke="#334155" stroke-width="1"/>
  <text x="28" y="564" class="muted" font-size="12">JSON 格式化</text>
  <text x="320" y="564" class="muted" font-size="14">›</text>

  <rect x="16" y="584" width="343" height="36" rx="6" class="card" stroke="#334155" stroke-width="1"/>
  <text x="28" y="606" class="muted" font-size="12">Base64 编码</text>
  <text x="320" y="606" class="muted" font-size="14">›</text>

  <!-- Bottom nav -->
  <rect x="0" y="635" width="375" height="32" fill="#1e293b" opacity="0.5"/>
  <text x="187" y="656" class="muted" font-size="10" text-anchor="middle">18 tools · offline · zero tracking</text>
</svg>
